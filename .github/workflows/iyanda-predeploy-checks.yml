name: Iyanda pre-deploy checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  syntax-and-feature-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate and syntax-check external application JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("src/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script\s+type="module"\s+src="/([^"]+)"\s*>\s*</script>', source)
          if not match:
              raise SystemExit("External application module reference is missing")
          path = Path("src") / match.group(1)
          if not path.is_file():
              raise SystemExit(f"Referenced application module does not exist: {path}")
          app = path.read_text(encoding="utf-8")
          if len(app) < 150000:
              raise SystemExit("Unexpectedly small application module; check extraction")
          Path("/tmp/iyanda-app.mjs").write_text(app, encoding="utf-8")
          print(f"External application module found: {len(app)} characters")
          PY
          node --check /tmp/iyanda-app.mjs
      - name: Check Stage 9 critical UI and handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/index.html").read_text(encoding="utf-8") + "\\n" + Path("src/iyanda-app-26b4305.js").read_text(encoding="utf-8")
          required = [
              'id="workspaceSection"', 'id="creativeStudioSection"',
              'id="languageCentre"', 'id="savedWorkList"',
              'id="workspaceSaveDraft"', 'id="creativeSaveWork"',
              'id="languageSaveWork"', 'iyanda_saved_work',
              'function savedWorkLoad', 'function savedWorkSave'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing Stage 9 elements: " + ", ".join(missing))
          print("Stage 9 critical UI and persistence hooks are present.")
          PY

      - name: Scan tracked application files for exposed credentials and required security headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import subprocess

          patterns = {
              "Paystack secret key": re.compile(r"sk_(?:live|test)_[A-Za-z0-9]{16,}"),
              "Supabase secret key": re.compile(r"sb_secret_[A-Za-z0-9_-]{20,}"),
              "private key block": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "embedded JWT": re.compile(r"eyJhbGciOi[A-Za-z0-9_-]{30,}"),
              "literal Paystack secret assignment": re.compile(r"PAYSTACK_SECRET_KEY\s*[:=]\s*[\"'][^\"']{8,}"),
              "literal Supabase service key assignment": re.compile(r"SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*[\"'][^\"']{8,}"),
          }
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings = []
          for name in filter(None, paths):
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(source):
                      findings.append(f"{name}: possible {label}")
          if findings:
              raise SystemExit("Potential exposed credentials detected:\n" + "\n".join(findings))
          print("No private credentials detected in tracked source files.")

          config = json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          headers = {
              item["key"].lower(): item["value"]
              for rule in config.get("headers", [])
              for item in rule.get("headers", [])
          }
          required = [
              "x-content-type-options",
              "x-frame-options",
              "referrer-policy",
              "strict-transport-security",
          ]
          missing = [name for name in required if name not in headers]
          if missing:
              raise SystemExit("Missing required Vercel security headers: " + ", ".join(missing))
          print("Required Vercel security headers are configured.")
          PY

      - name: Smoke-test public page routing and farm quiz banks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          from collections import Counter

          source = Path("src/index.html").read_text(encoding="utf-8") + "\\n" + Path("src/iyanda-app-26b4305.js").read_text(encoding="utf-8")
          route_block = re.search(r"const pageIds=\[(.*?)\];", source, re.S)
          if not route_block:
              raise SystemExit("Public page router list was not found")
          routes = re.findall(r"'([^']+)'", route_block.group(1))
          ids = re.findall(r'\bid="([^"]+)"', source)
          # Ignore IDs assembled inside JavaScript template strings; those are per-record runtime IDs.
          literal_ids = [value for value in ids if not any(token in value for token in ("+", "${", "}", "$"))]
          counts = Counter(literal_ids)
          duplicates = sorted(key for key, count in counts.items() if count > 1)
          if duplicates:
              raise SystemExit("Duplicate HTML IDs detected: " + ", ".join(duplicates))
          missing = [route for route in routes if f'id="{route}"' not in source]
          if missing:
              raise SystemExit("Router pages without matching page sections: " + ", ".join(missing))
          for route in ["home", "shop", "features", "games", "farmCentre",
                        "customerHub", "deliveryInfo", "orderTracking", "loyalty",
                        "afterSales", "faq", "farmGames", "farmQuiz",
                        "farmAdventure", "harvestChallenge", "contact"]:
              if route not in routes:
                  raise SystemExit("Missing public customer journey route: " + route)
          if not re.search(r"customerAssistant\s*:\s*'customerHub'", source):
              raise SystemExit("Legacy customer-help route no longer points to Customer Hub")
          print(f"Public router smoke check passed: {len(routes)} routes, unique IDs, required destinations present.")

          public_dir = Path("public/farm-quiz-data")
          files = sorted(public_dir.glob("*.json"))
          if len(files) != 10:
              raise SystemExit(f"Expected 10 public farm quiz banks, found {len(files)}")
          for public_file in files:
              data = json.loads(public_file.read_text(encoding="utf-8"))
              questions = data.get("questions", [])
              if len(questions) != 150:
                  raise SystemExit(f"{public_file}: expected 150 questions, found {len(questions)}")
              for number, question in enumerate(questions, 1):
                  options = question.get("options", [])
                  if len(options) != 4 or sum(bool(option.get("correct")) for option in options) != 1:
                      raise SystemExit(f"{public_file}: question {number} must have four options and exactly one correct answer")
              source_file = Path("src/farm-quiz-data") / public_file.name
              if not source_file.is_file() or json.loads(source_file.read_text(encoding="utf-8")) != data:
                  raise SystemExit(f"Source/public quiz bank mismatch: {public_file.name}")
          print("Farm quiz data smoke check passed: 10 banks, 1,500 questions, answer integrity and source/public parity.")
          PY

      - name: Validate public policy page and SEO discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          legal = Path("src/legal/index.html")
          if not legal.is_file():
              raise SystemExit("Public legal page is missing")
          page = legal.read_text(encoding="utf-8")
          required = [
              'id="privacy"', 'id="terms"', 'id="refunds"',
              'id="delivery"', 'id="sellers"', 'id="partners"',
              'mailto:iyandafarmsltd@gmail.com',
              'https://wa.me/2347043071733'
          ]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit("Policy page is missing required sections/contact links: " + ", ".join(missing))
          ids = re.findall(r'\bid="([^"]+)"', page)
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate IDs detected in the policy page")
          ET.parse("src/sitemap.xml")
          sitemap = Path("src/sitemap.xml").read_text(encoding="utf-8")
          if "https://iyanda-unified.vercel.app/legal/" not in sitemap:
              raise SystemExit("Policy page is not listed in the sitemap")
          home = Path("src/index.html").read_text(encoding="utf-8")
          for marker in ['href="/legal/"', 'property="og:image"', 'name="twitter:image"']:
              if marker not in home:
                  raise SystemExit("Homepage legal/SEO marker missing: " + marker)
          print("Public policy page, unique IDs, sitemap and social sharing metadata checks passed.")
          PY

      - name: Check privacy-preserving client error monitoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/posthog-init.js").read_text(encoding="utf-8")
          required = ["iyanda_client_error", "uncaught_error", "unhandled_rejection",
                      "window.addEventListener('error'", "window.addEventListener('unhandledrejection'"]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Client error monitoring is incomplete: " + ", ".join(missing))
          forbidden = ["event.message", "event.error.stack", "event.reason", "innerText", "textContent"]
          present = [item for item in forbidden if item in source]
          if present:
              raise SystemExit("Client error monitoring may capture raw user/error content: " + ", ".join(present))
          print("Client error monitoring captures only generic error categories.")
          PY
